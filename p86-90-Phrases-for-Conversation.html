<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Step by Step Towards EIKEN Grade 5 p86-90 Simple Phrases for Conversation</title>
<script src="auth.js"></script>
<style>
  *, *::before, *::after {
    box-sizing: border-box;
  }

  :root {
    --green: #4CAF50;
    --green-hover: #388E3C;
    --orange: #ff9800;
    --dark-orange: #e65100;
    --grey: #9E9E9E;
    --dark-grey: #4a4a4a;
    --border-color: #cbd5e0;
    --white: #ffffff;
    --black: #333333;
    --bg-color: #eef2f7;
    --card-bg: #f8fafc;
    --primary-blue: #1e88e5;
    --soft-blue: #e3f2fd;
    --red: #e53e3e;
    --purple: #7e57c2;
    --teal: #00897b;
    --pink: #ec407a;
  }

  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background-color: var(--bg-color);
    color: var(--black);
    margin: 0;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    max-width: 820px;
    width: 100%;
    background: var(--white);
    padding: 28px 32px;
    border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
  }

  h1 {
    color: var(--primary-blue);
    text-align: center;
    border-bottom: 3px solid var(--orange);
    margin: 0 0 18px 0;
    font-size: 1.45rem;
    padding-bottom: 10px;
    line-height: 1.4;
  }

  /* タブ切り替え */
  .tab-container {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .tab-btn {
    padding: 10px 18px;
    border: 2px solid var(--primary-blue);
    background-color: var(--white);
    color: var(--primary-blue);
    font-weight: bold;
    border-radius: 25px;
    cursor: pointer;
    font-size: 0.95rem;
    transition: all 0.15s;
    font-family: inherit;
  }

  .tab-btn:hover {
    background-color: var(--soft-blue);
  }

  .tab-btn.active {
    background-color: var(--primary-blue);
    color: var(--white);
  }

  .tab-btn.part4-tab {
    border-color: var(--teal);
    color: var(--teal);
  }

  .tab-btn.part4-tab.active {
    background-color: var(--teal);
    color: var(--white);
  }

  /* プログレスバー */
  .progress-wrapper {
    margin-bottom: 20px;
    text-align: center;
  }

  .progress-counter {
    font-weight: bold;
    color: var(--primary-blue);
    font-size: 1rem;
    margin-bottom: 8px;
  }

  .progress-bar {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
  }

  .progress-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background-color: #cbd5e0;
    transition: all 0.3s;
  }

  .progress-dot.active {
    background-color: var(--orange);
    transform: scale(1.25);
  }

  .progress-dot.completed {
    background-color: var(--green);
  }

  /* 問題カード */
  .question-card {
    background: var(--card-bg);
    border: 2px solid #bbdefb;
    border-radius: 18px;
    padding: 24px;
    margin-bottom: 18px;
  }

  .question-card.step2-card {
    border-color: #f8bbd0;
  }

  .question-card.dialogue-card {
    border-color: #b2dfdb;
  }

  .step-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .step-badge {
    background-color: var(--primary-blue);
    color: white;
    padding: 4px 14px;
    border-radius: 12px;
    font-size: 0.85rem;
    font-weight: bold;
  }

  .step-badge.step2 {
    background-color: var(--pink);
  }

  .step-badge.dialogue {
    background-color: var(--teal);
  }

  .step-instruction {
    font-size: 1.05rem;
    font-weight: bold;
    color: var(--dark-grey);
  }

  /* 音声再生エリア */
  .audio-box {
    background: var(--white);
    border: 2px solid #e2e8f0;
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    margin-bottom: 18px;
  }

  .big-speaker-btn {
    background: var(--purple);
    color: white;
    border: none;
    padding: 14px 32px;
    border-radius: 50px;
    font-size: 1.2rem;
    font-family: inherit;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #5e35b1;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: all 0.1s;
  }

  .big-speaker-btn:hover {
    background: #673ab7;
  }

  .big-speaker-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #5e35b1;
  }

  .audio-hint {
    font-size: 0.85rem;
    color: #64748b;
    margin-top: 8px;
  }

  /* Step 2 英語フレーズ表示 */
  .target-en-box {
    background: #fff9db;
    border: 2px solid #ffe066;
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .target-en-text {
    font-size: 1.45rem;
    font-weight: bold;
    color: #1e293b;
  }

  .mini-speaker-btn {
    background: var(--purple);
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
    font-family: inherit;
  }

  /* ダイアログボックス（Part 4） */
  .dialogue-box {
    text-align: left;
    background: var(--white);
    padding: 20px 24px;
    border-radius: 14px;
    border: 2px solid #b2dfdb;
    margin-bottom: 18px;
    font-size: 1.2rem;
    font-weight: bold;
    line-height: 1.85;
  }

  .dialogue-line {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 8px;
  }

  .dialogue-line:last-child {
    margin-bottom: 0;
  }

  .speaker-label {
    color: var(--teal);
    min-width: 75px;
    font-weight: 900;
  }

  .blank-box {
    display: inline-block;
    min-width: 140px;
    padding: 2px 12px;
    margin: 0 4px;
    border-bottom: 3px solid var(--teal);
    color: var(--teal);
    background-color: #e0f2f1;
    border-radius: 6px;
    text-align: center;
  }

  /* 4択ボタン */
  .choices-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 10px;
  }

  .choice-btn {
    background-color: var(--white);
    border: 2px solid var(--border-color);
    padding: 14px 12px;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: bold;
    color: var(--black);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    line-height: 1.4;
  }

  .choice-btn:hover {
    border-color: var(--primary-blue);
    background-color: #f0f9ff;
  }

  .choice-btn.selected {
    background-color: var(--primary-blue);
    color: white;
    border-color: var(--primary-blue);
  }

  .dialogue-card .choice-btn.selected {
    background-color: var(--teal);
    border-color: var(--teal);
  }

  /* フィードバック */
  .error-feedback {
    color: var(--red);
    font-weight: bold;
    font-size: 1.1rem;
    text-align: center;
    margin-top: 10px;
    min-height: 24px;
  }

  /* お祝い画面 */
  .celebration-box {
    text-align: center;
    padding: 24px 16px;
    background: #f0fdf4;
    border: 2px solid #bbf7d0;
    border-radius: 18px;
    animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    margin-bottom: 18px;
  }

  .celebration-title {
    font-size: 1.75rem;
    color: #16a34a;
    font-weight: bold;
    margin-bottom: 12px;
  }

  .final-sentence {
    font-size: 1.35rem;
    font-weight: bold;
    color: #1e3a8a;
    margin-bottom: 8px;
    line-height: 1.6;
  }

  .final-ja {
    font-size: 1.05rem;
    font-weight: bold;
    color: #475569;
    margin-bottom: 16px;
  }

  /* アクションボタン */
  .action-btn {
    padding: 12px 38px;
    font-size: 1.1rem;
    background-color: var(--green);
    color: white;
    border: none;
    border-radius: 35px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 4px 0 #2e7d32;
    display: block;
    margin: 14px auto 0 auto;
    font-family: inherit;
  }

  .action-btn:hover { background-color: var(--green-hover); }
  .action-btn:active { transform: translateY(3px); box-shadow: none; }

  .next-btn {
    background-color: var(--orange);
    box-shadow: 0 4px 0 var(--dark-orange);
  }
  .next-btn:hover { background-color: #fb8c00; }

  /* 結果画面 */
  .result-screen {
    display: none;
    text-align: center;
    padding: 20px 10px;
  }

  .result-screen h2 {
    color: var(--green);
    font-size: 26px;
    margin-bottom: 12px;
  }

  .mistake-list-box {
    background: #fff5f5;
    border: 2px dashed var(--red);
    border-radius: 12px;
    padding: 18px;
    margin: 18px 0;
    text-align: left;
  }

  .mistake-list-title {
    color: var(--red);
    font-weight: bold;
    font-size: 1.05rem;
    margin-bottom: 10px;
  }

  .mistake-item {
    color: #c53030;
    font-size: 0.98rem;
    margin-bottom: 8px;
    line-height: 1.5;
  }

  .name-input-group {
    margin: 22px 0 14px 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .name-input-group input {
    font-size: 1.05rem;
    padding: 10px 14px;
    border: 2px solid var(--border-color);
    border-radius: 10px;
    width: 220px;
    font-family: inherit;
  }

  .report-btn {
    background-color: var(--primary-blue);
    box-shadow: 0 4px 0 #1565c0;
  }

  .restart-btn {
    background-color: var(--orange);
    color: white;
    padding: 12px 30px;
    font-size: 1.05rem;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    margin-top: 18px;
    box-shadow: 0 4px 0 var(--dark-orange);
    font-family: inherit;
  }

  @keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  @media (max-width: 640px) {
    .container { padding: 16px; }
    h1 { font-size: 1.2rem; }
    .choices-grid { grid-template-columns: 1fr; }
    .dialogue-box { font-size: 1.05rem; padding: 14px; }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Step by Step Towards EIKEN Grade 5<br>p86-90 Simple Phrases for Conversation</h1>

  <!-- タブ切り替え -->
  <div class="tab-container">
    <button class="tab-btn active" onclick="switchTab('part1', this)">Part 1 (17問)</button>
    <button class="tab-btn" onclick="switchTab('part2', this)">Part 2 (16問)</button>
    <button class="tab-btn" onclick="switchTab('part3', this)">Part 3 (16問)</button>
    <button class="tab-btn part4-tab" onclick="switchTab('part4', this)">Part 4: 会話ダイアログ (20問)</button>
  </div>

  <div id="quiz-content">
    <div class="progress-wrapper">
      <div class="progress-counter" id="progress-counter">Question 1 / 17</div>
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <!-- STEP 1: リスニング（Part 1-3） -->
    <div class="question-card" id="step1-card" style="display: none;">
      <div class="step-header">
        <span class="step-badge">STEP 1</span>
        <span class="step-instruction">音声を聞いて、正しい英語のフレーズを選ぼう</span>
      </div>
      <div class="audio-box">
        <button class="big-speaker-btn" onclick="speakTarget()">🔊 音声を聞く</button>
        <div class="audio-hint">※ボタンを押すと何度でも聞けます</div>
      </div>
      <div class="choices-grid" id="s1-choices"></div>
      <div class="error-feedback" id="s1-feedback"></div>
      <button class="action-btn" onclick="checkStep1()">答え合わせ</button>
    </div>

    <!-- STEP 2: 和訳選択（Part 1-3） -->
    <div class="question-card step2-card" id="step2-card" style="display: none;">
      <div class="step-header">
        <span class="step-badge step2">STEP 2</span>
        <span class="step-instruction">会話の中で一番しっくりくる日本語訳を選ぼう</span>
      </div>
      <div class="target-en-box">
        <span class="target-en-text" id="s2-en-text"></span>
        <button class="mini-speaker-btn" onclick="speakTarget()">🔊 聞く</button>
      </div>
      <div class="choices-grid" id="s2-choices"></div>
      <div class="error-feedback" id="s2-feedback"></div>
      <button class="action-btn" onclick="checkStep2()">答え合わせ</button>
    </div>

    <!-- PART 4: ダイアログ穴埋め -->
    <div class="question-card dialogue-card" id="dialogue-card" style="display: none;">
      <div class="step-header">
        <span class="step-badge dialogue">Part 4</span>
        <span class="step-instruction">会話が成り立つように、( ? ) に入るフレーズを選ぼう</span>
      </div>
      <div id="dialogue-display-area"></div>
      <div class="choices-grid" id="dialogue-choices"></div>
      <div class="error-feedback" id="dialogue-feedback"></div>
      <button class="action-btn" onclick="checkDialogue()">答え合わせ</button>
    </div>

    <!-- 正解時の祝福表示 -->
    <div id="celebration-area" style="display: none;">
      <div class="celebration-box">
        <div class="celebration-title" id="celebration-title">Great!</div>
        <div class="final-sentence" id="celebration-en"></div>
        <div class="final-ja" id="celebration-ja"></div>
        <button class="mini-speaker-btn" style="padding:10px 24px; font-size:1.05rem;" onclick="speakCelebration()">🔊 Listen</button>
      </div>
      <button class="action-btn next-btn" onclick="nextQuestion()">Next ➔</button>
    </div>
  </div>

  <!-- 結果・報告画面 -->
  <div class="result-screen" id="result-screen">
    <h2 id="result-title">🎉 Completed! 🎉</h2>
    <p id="result-desc"></p>

    <div id="mistake-container" style="display: none;">
      <div class="mistake-list-box">
        <div class="mistake-list-title">⚠️ 間違えた問題（要復習）：</div>
        <div id="mistake-list"></div>
      </div>
    </div>

    <div id="report-container" style="display: none;">
      <div class="name-input-group">
        <label for="student-name"><b>お名前:</b></label>
        <input type="text" id="student-name" placeholder="名前を入力してください">
      </div>
      <button class="action-btn report-btn" onclick="sendEmailReport()">Tamaki先生に報告する 📧</button>
    </div>

    <button class="restart-btn" onclick="restartCurrentTab()">もう一度挑戦する 🔄</button>
  </div>
</div>

<script>
  let preferredVoice = null;
  function loadVoices() {
    if (!window.speechSynthesis) return;
    const voices = window.speechSynthesis.getVoices();
    if (voices.length === 0) return;
    preferredVoice =
      voices.find(v => v.lang === "en-US" && v.name.includes("Google US English")) ||
      voices.find(v => v.lang === "en-US" && v.name.includes("Samantha")) ||
      voices.find(v => v.lang.startsWith("en-US")) ||
      voices.find(v => v.lang.startsWith("en"));
  }

  if (typeof window !== 'undefined' && window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
  }

  function speak(text) {
    const synth = window.speechSynthesis;
    if (!synth) return;
    synth.cancel();
    const uttr = new SpeechSynthesisUtterance(text);
    if (preferredVoice) uttr.voice = preferredVoice;
    uttr.lang = 'en-US';
    uttr.rate = 0.85;
    uttr.pitch = 1.0;
    synth.speak(uttr);
  }

  function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

      },
      {

        ja: "私は今から学校へ行くところです。",

      },
      {

        enDistractors: ["Have a nice weekend.", "Good morning!", "Have a good trip!"],
        jaDistractors: ["よい週末を。", "おやすみなさい。", "おかえりなさい。"]
      },
      {
        en: "Good morning!",

        jaDistractors: ["おやすみなさい。", "こんにちは！", "こんばんは！"]
      },
      {

        ja: "お元気ですか。",

      {

      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = opt;
      btn.onclick = () => {
        document.querySelectorAll('#dialogue-choices .choice-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedChoice = opt;
        updateDialogueDisplay();
      };
      grid.appendChild(btn);
    });
  }

  function updateDialogueDisplay() {
    const data = currentList[currentIdx];
    const text = selectedChoice ? selectedChoice : " ? ";
    const area = document.getElementById('dialogue-display-area');

    const linesHtml = data.lines.map(line => {
      const replaced = line.text.replace("(  ?  )", `<span class="blank-box">${text}</span>`);
      return `<div class="dialogue-line"><span class="speaker-label">${line.speaker}</span><span>${replaced}</span></div>`;
    }).join('');

    area.innerHTML = `<div class="dialogue-box">${linesHtml}</div>`;
  }

  function checkDialogue() {
    const data = currentList[currentIdx];
    const fb = document.getElementById('dialogue-feedback');

    if (!selectedChoice) {
      fb.textContent = "選択肢を選んでください。";
      return;
    }

    if (selectedChoice === data.answer) {
      fb.textContent = '';
      document.getElementById('dialogue-card').style.display = 'none';
      const completedLines = data.lines.map(l => `${l.speaker} ${l.text.replace("(  ?  )", data.answer)}`).join('<br>');
      showCelebration(completedLines, data.ja, true);
    } else {
      fb.textContent = "Try again!";
      mistakes.push(`・正解: ${data.answer}（${data.ja}）`);
    }
  }

  /* --- お祝い表示 --- */
  function showCelebration(enHtml, jaText, isHtml = false) {
    const randomCeleb = celebrations[Math.floor(Math.random() * celebrations.length)];
    document.getElementById('celebration-title').textContent = randomCeleb;

    const enEl = document.getElementById('celebration-en');
    if (isHtml) {
      enEl.innerHTML = enHtml;
    } else {
      enEl.textContent = enHtml;
    }

    document.getElementById('celebration-ja').textContent = jaText;
    document.getElementById('celebration-area').style.display = 'block';
    document.getElementById(`dot-${currentIdx}`).classList.add('completed');

    speakCelebration();
  }

  function speakCelebration() {
    const data = currentList[currentIdx];
    if (!data) return;
    if (currentTab === 'part4') {
      speak(data.fullText);
    } else {
      speak(data.en);
    }
  }

  function nextQuestion() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    document.getElementById(`dot-${currentIdx}`).classList.remove('active');

    currentIdx++;
    if (currentIdx < currentList.length) {
      document.getElementById(`dot-${currentIdx}`).classList.add('active');
      loadQuestion();
    } else {
      showFinalResult();
    }
  }

  function showFinalResult() {
    document.getElementById('quiz-content').style.display = 'none';
    const resScreen = document.getElementById('result-screen');
    resScreen.style.display = 'block';

    const tabLabels = {
      part1: "Part 1",
      part2: "Part 2",
      part3: "Part 3",
      part4: "Part 4（会話ダイアログ）"
    };

    const desc = document.getElementById('result-desc');
    const mistContainer = document.getElementById('mistake-container');
    const mistList = document.getElementById('mistake-list');
    const reportContainer = document.getElementById('report-container');

    if (mistakes.length === 0) {
      desc.textContent = `【${tabLabels[currentTab]}】全${currentList.length}問パーフェクトクリアです！Tamaki先生に完了報告を送ろう！`;
      mistContainer.style.display = 'none';
      reportContainer.style.display = 'block';
    } else {
      const uniqueMistakes = [...new Set(mistakes)];
      desc.textContent = `【${tabLabels[currentTab]}】惜しい！間違えた問題があります。全問ノーミスでクリアするとTamaki先生に報告できます。`;
      mistList.innerHTML = uniqueMistakes.map(m => `<div class="mistake-item">${m}</div>`).join('');
      mistContainer.style.display = 'block';
      reportContainer.style.display = 'none';
    }
  }

  function restartCurrentTab() {
    initTab();
  }

  function sendEmailReport() {
    const nameInput = document.getElementById('student-name');
    const name = nameInput.value.trim();

    if (!name) {
      alert("お名前を入力してください。");
      return;
    }

    const tabLabels = {
      part1: "Part 1",
      part2: "Part 2",
      part3: "Part 3",
      part4: "Part 4: 会話ダイアログ"
    };

    const recipient = "tamaki@eigostudio-stepforward.com";
    const subject = encodeURIComponent(`【課題完了報告】Step by Step Towards EIKEN Grade 5 p86-90 [${tabLabels[currentTab]}] (${name})`);
    const body = encodeURIComponent(`Tamaki先生\n\nStep by Step Towards EIKEN Grade 5 p86-90 Simple Phrases for Conversation の【${tabLabels[currentTab]}】を全問正解でクリアしました！\n\n生徒名: ${name}`);

    window.location.href = `mailto:${recipient}?subject=${subject}&body=${body}`;
  }

  window.onload = initTab;
</script>

</body>
</html>
