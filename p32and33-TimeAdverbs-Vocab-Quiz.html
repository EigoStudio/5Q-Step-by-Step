<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Step by Step Towards EIKEN Grade 5 p32 - 33 Time Adverbs / Time Expressions</title>
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f1f8e9;
            --header-gray: #455a64;
            --accent-yellow: #fdd835;
            --text-dark: #263238;
            --white: #ffffff;
            --error-red: #ff5252;
            --success-green: #4caf50;
            --base-font: 'Andika', "Hiragino Maru Gothic ProN", "Hiragino Maru Gothic Pro", "Yu Gothic", "Meiryo", sans-serif;
        }

        body {
            font-family: var(--base-font);
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            background-color: var(--header-gray);
            color: var(--white);
            width: 100%;
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .container {
            max-width: 600px;
            width: 90%;
            margin: 20px 0;
            background: var(--white);
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            text-align: center;
            border: 5px solid var(--accent-yellow);
        }

        .progress-bar { font-size: 1.1rem; color: var(--header-gray); margin-bottom: 15px; font-weight: bold; }
        
        .word-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 10px 0 30px 0;
        }

        .word-display { 
            font-size: 4rem; 
            font-weight: 700; 
            color: var(--header-gray); 
            letter-spacing: 1px;
            margin: 0;
            word-break: break-word;
        }

        .speaker-btn {
            background: #e1f5fe;
            border: 2px solid #03a9f4;
            color: #03a9f4;
            font-size: 2rem;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.2s;
            box-shadow: 0 4px 0 #0288d1;
            flex-shrink: 0;
        }
        .speaker-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0288d1;
        }

        .choices-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .choice-btn {
            background: var(--white);
            border: 3px solid var(--header-gray);
            border-radius: 20px;
            font-size: 1.6rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--header-gray);
            font-family: var(--base-font);
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 10px;
        }

        .choice-btn:hover { background-color: #eceff1; transform: scale(1.02); }
        .choice-btn.wrong { background-color: #ffebee; border-color: var(--error-red); color: var(--error-red); animation: shake 0.3s; }

        @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-5px);} 75% {transform: translateX(5px);} }

        #result-screen { display: none; }
        .score-num { font-size: 4rem; color: var(--header-gray); font-weight: 700; }
        .mistake-list { text-align: left; background: #fafafa; padding: 15px; border-radius: 10px; margin-top: 20px; border: 1px solid #cfd8dc; }
        .mistake-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }

        .action-btn { 
            background-color: var(--header-gray); 
            color: white; 
            border: none; 
            padding: 15px 40px; 
            border-radius: 40px; 
            font-size: 1.1rem; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 15px; 
            width: 100%;
            font-family: var(--base-font);
        }
    </style>
</head>
<body>

<header>
    <h1 style="font-size: 1.05rem;">Step by Step Towards EIKEN Grade 5 p32 - 33 Time Adverbs / Time Expressions</h1>
</header>

<div class="container" id="quiz-screen">
    <div class="progress-bar" id="progress">1 / 17</div>
    <div class="word-area">
        <div class="word-display" id="word-text">Loading...</div>
        <button class="speaker-btn" onclick="speakCurrentWord()">🔊</button>
    </div>
    <div class="choices-grid" id="choices-container"></div>
    <div id="feedback" style="margin-top:20px; height: 1.2em; font-weight: bold; font-size: 1.3rem;"></div>
</div>

<div class="container" id="result-screen">
    <h2 style="font-size: 1.8rem;">トレーニング終了！</h2>
    <div style="font-size: 1.2rem;">正解数：<span class="score-num" id="final-score">0</span> / 17</div>
    <div id="mistake-container" style="display:none;">
        <h3 style="color: var(--header-gray); margin-top:25px;">もういちど 確認しよう！</h3>
        <div class="mistake-list" id="mistake-list"></div>
    </div>
    <button class="action-btn" onclick="sendEmail()">Tamaki先生に報告する</button>
    <button class="action-btn" style="background-color: #90a4ae;" onclick="location.reload()">もう一度やる</button>
</div>

<script>
/* --- 音声読み上げ設定 --- */
let preferredVoice = null;

function loadVoices() {
    if (!('speechSynthesis' in window)) return;
    const voices = window.speechSynthesis.getVoices();
    if (voices.length === 0) return;

    const usVoices = voices.filter(v => v.lang === "en-US" || v.lang === "en_US" || v.lang.startsWith("en"));
    
    // 若いアメリカ英語女性の声を優先選択
    preferredVoice = 
        usVoices.find(v => v.name.includes("Ava")) ||
        usVoices.find(v => v.name.includes("Ana")) ||
        usVoices.find(v => v.name.includes("Jenny")) ||
        usVoices.find(v => v.name.includes("Google US English")) ||
        usVoices.find(v => v.name.includes("Google English")) ||
        usVoices.find(v => v.name.includes("Samantha")) ||
        usVoices.find(v => v.name.includes("Aria")) ||
        usVoices[0] || 
        voices[0];
}

if (typeof window !== 'undefined' && window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
}

function speak(txt, rate = 0.75) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    if (!preferredVoice) loadVoices();

    let u = new SpeechSynthesisUtterance(txt);
    if (preferredVoice) u.voice = preferredVoice;
    u.lang = "en-US"; 
    u.rate = rate; // 0.75
    u.pitch = 1.0;
    
    window.speechSynthesis.resume();
    window.speechSynthesis.speak(u);
}

function speakCurrentWord() {
    const word = document.getElementById('word-text').textContent;
    speak(word);
}

const quizData = [
    {w:"next week", a:"来週", c:["今週","先週","来月"]},
    {w:"next month", a:"来月", c:["今月","先月","来年"]},
    {w:"next weekend", a:"来週末", c:["今週末","先週末","来週"]},
    {w:"next year", a:"来年", c:["今年","去年","来月"]},
    {w:"this week", a:"今週", c:["来週","先週","今月"]},
    {w:"this month", a:"今月", c:["来月","先月","今年"]},
    {w:"this morning", a:"今朝", c:["今夜","今日の午後","明日の朝"]},
    {w:"this weekend", a:"今週末", c:["来週末","今週","先週末"]},
    {w:"this year", a:"今年", c:["来年","去年","今月"]},
    {w:"today", a:"今日", c:["明日","昨日","今夜"]},
    {w:"tomorrow", a:"明日", c:["今日","あさって","昨日"]},
    {w:"tonight", a:"今夜", c:["今朝","明日の夜","今日の午後"]},
    {w:"afternoon", a:"昼・午後", c:["朝","夜","深夜"]},
    {w:"evening", a:"夕方・晩", c:["朝","昼","夜中"]},
    {w:"morning", a:"朝", c:["昼","晩","夜"]},
    {w:"night", a:"夜", c:["朝","昼","夕方"]},
    {w:"noon", a:"正午・昼の12時", c:["夜の12時","朝","夕方"]}
];

let quizQueue = [...quizData].sort(() => Math.random() - 0.5);
let currentIndex = 0;
let firstTryCorrectCount = 0;
let isFirstTry = true;
let mistakes = [];

function loadQuestion() {
    const current = quizQueue[currentIndex];
    document.getElementById('progress').textContent = `${currentIndex + 1} / ${quizQueue.length}`;
    document.getElementById('word-text').textContent = current.w;
    document.getElementById('feedback').textContent = "";

    const container = document.getElementById('choices-container');
    container.innerHTML = '';
    isFirstTry = true;

    const choices = [current.a, ...current.c].sort(() => Math.random() - 0.5);

    choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choice;
        btn.onclick = () => checkAnswer(choice, current.a, btn);
        container.appendChild(btn);
    });
}

function checkAnswer(selected, correct, btn) {
    if (selected === correct) {
        if (isFirstTry) { firstTryCorrectCount++; }
        document.getElementById('feedback').style.color = "var(--success-green)";
        document.getElementById('feedback').textContent = "Excellent! ✨";
        setTimeout(() => {
            currentIndex++;
            if (currentIndex < quizQueue.length) { loadQuestion(); } else { showResult(); }
        }, 600);
    } else {
        if (isFirstTry) {
            mistakes.push({w: quizQueue[currentIndex].w, a: quizQueue[currentIndex].a});
            isFirstTry = false;
        }
        btn.classList.add('wrong');
        document.getElementById('feedback').style.color = "var(--error-red)";
        document.getElementById('feedback').textContent = "Try again!";
    }
}

function showResult() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    document.getElementById('final-score').textContent = firstTryCorrectCount;
    if (mistakes.length > 0) {
        document.getElementById('mistake-container').style.display = 'block';
        document.getElementById('mistake-list').innerHTML = mistakes.map(m => `
            <div class="mistake-item"><strong>${m.w}</strong><span>${m.a}</span></div>
        `).join('');
    }
}

function sendEmail() {
    const teacherEmail = "tamaki@eigostudio-stepforward.com";
    const subject = encodeURIComponent("Step by Step p32 - 33 Time Adverbs / Time Expressions 学習結果");
    const cleanMistakes = mistakes.map(m => `・${m.w} (${m.a})`).join("\n");
    let mistakeText = mistakes.length > 0 ? "\n\n■要復習リスト:\n" + cleanMistakes : "\n\nすべて一発正解でした！すばらしい！";
    const body = encodeURIComponent(`Tamaki先生へ\n\n「Step by Step Towards EIKEN Grade 5 p32 - 33 Time Adverbs / Time Expressions」のトレーニングを完了しました！\n\n結果: ${quizQueue.length}問中 ${firstTryCorrectCount} 問を一発正解。${mistakeText}`);
    window.location.href = `mailto:${teacherEmail}?subject=${subject}&body=${body}`;
}

window.onload = function() {
    loadVoices();
    loadQuestion();
};
</script>
</body>
</html>
