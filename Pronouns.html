<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronoun Master: Step by Step!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #e8f5e9;
            --accent: #8d6e63;
            --accent-yellow: #fdd835;
            --bg: #f4f6f4;
            --card-bg: #ffffff;
            --text: #3e2723;
            --gray-border: #cfd8dc;
            --success: #2e7d32;
            --error: #d32f2f;
        }

        * { 
            box-sizing: border-box; 
            font-family: "Andika", "Zen Maru Gothic", sans-serif; 
        }

        body {
            background: linear-gradient(135deg, var(--bg), #e8ebe8);
            color: var(--text);
            margin: 0; 
            padding: 20px;
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
        }

        .container { 
            max-width: 680px; 
            width: 100%; 
        }

        header { 
            text-align: center; 
            margin-bottom: 20px; 
        }

        h1 { 
            color: var(--primary); 
            font-size: 1.6rem; 
            margin-bottom: 5px; 
            line-height: 1.3; 
        }

        .page-counter {
            font-size: 1.1rem; 
            font-weight: bold; 
            color: #455a64; 
            text-align: center; 
            margin-bottom: 8px;
        }

        .progress-bar {
            width: 100%; 
            height: 10px; 
            background-color: #cbd5e1;
            border-radius: 5px; 
            margin-bottom: 20px; 
            overflow: hidden;
        }

        .progress-fill {
            height: 100%; 
            width: 0%; 
            background-color: var(--primary);
            transition: width 0.3s ease;
        }

        .card {
            background: var(--card-bg); 
            border-radius: 20px; 
            padding: 30px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); 
            border: 2px solid #fff;
            display: none; 
            animation: fadeIn 0.4s ease forwards;
        }

        .card.active { 
            display: block; 
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px dashed #a5d6a7;
            padding-bottom: 10px;
        }

        .card-title {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent);
        }

        .speak-btn {
            background: var(--accent);
            color: white;
            font-size: 0.9rem;
            padding: 6px 14px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            box-shadow: 0 3px 0 #5d4037;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .paragraph-box {
            font-size: 1.3rem;
            line-height: 2.2;
            color: var(--text);
            font-weight: bold;
            background: var(--primary-light);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #c8e6c9;
            margin-bottom: 25px;
        }

        .sentence-line {
            margin-bottom: 8px;
        }

        /* Pull-down (Select) styling */
        select.blank-select {
            font-size: 1.15rem;
            font-weight: bold;
            padding: 4px 10px;
            border: 2.5px solid var(--primary);
            border-radius: 8px;
            background-color: #ffffff;
            color: var(--primary);
            cursor: pointer;
            outline: none;
            transition: all 0.2s;
            margin: 0 4px;
        }

        select.blank-select:focus {
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.3);
        }

        select.blank-select.correct {
            border-color: var(--success);
            background-color: #dcfce7;
            color: var(--success);
            pointer-events: none;
        }

        select.blank-select.wrong {
            border-color: var(--error);
            background-color: #ffebee;
            color: var(--error);
        }

        .check-btn {
            padding: 14px 30px;
            font-weight: bold;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            color: white;
            width: 100%;
            background: var(--primary);
            box-shadow: 0 5px 0 #1b5e20;
            transition: 0.1s;
        }

        .check-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        .hint-box {
            margin-top: 15px;
            padding: 12px;
            background: #fff3e0;
            border-left: 4px solid #ffb74d;
            border-radius: 8px;
            font-size: 1rem;
            color: #e65100;
            display: none;
            font-weight: bold;
        }

        #excellentPopup {
            position: fixed; 
            top: 40px; 
            left: 50%; 
            transform: translateX(-50%) translateY(-20px);
            background-color: var(--accent-yellow); 
            color: #3e2723; 
            padding: 12px 40px; 
            border-radius: 50px;
            font-weight: bold; 
            font-size: 1.6rem; 
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            opacity: 0; 
            pointer-events: none; 
            transition: all 0.3s ease; 
            z-index: 1000;
        }

        #excellentPopup.show { 
            opacity: 1; 
            transform: translateX(-50%) translateY(0); 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div id="excellentPopup">Perfect! 🌟</div>

<div class="container">
    <header>
        <h1>Pronoun Master: Step by Step! ✨</h1>
        <p style="margin: 0; color: #546e7a;">Choose the correct word for each blank!</p>
    </header>

    <div class="page-counter">Page <span id="pageNum">1</span> / 6</div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div id="quiz-container"></div>

    <div class="card" id="card-result" style="text-align: center;">
        <h2 style="color: var(--primary);">Awesome Job! 🎉</h2>
        <p style="font-size: 1.3rem; font-weight: bold;">You mastered all 6 pages!</p>
        <button class="check-btn" onclick="location.reload()" style="max-width: 250px; margin-top: 15px;">Try Again 🔄</button>
    </div>
</div>

<script>
    // 6 Pages with Smooth Contextual Flow
    const pagesData = [
        {
            title: "Page 1: Red Hat (I / my / me / mine)",
            hint: "Check: I (主格) -> my (所有格) -> me (目的格) -> mine (所有代名詞)",
            paragraphHtml: `
                <div class="sentence-line">
                    <select class="blank-select" data-ans="I">
                        <option value="">[ ? ]</option>
                        <option value="I">I</option>
                        <option value="My">My</option>
                        <option value="Me">Me</option>
                    </select> have a red hat.
                </div>
                <div class="sentence-line">
                    But I can't find 
                    <select class="blank-select" data-ans="my">
                        <option value="">[ ? ]</option>
                        <option value="I">I</option>
                        <option value="my">my</option>
                        <option value="mine">mine</option>
                    </select> red hat.
                </div>
                <div class="sentence-line">
                    Please help 
                    <select class="blank-select" data-ans="me">
                        <option value="">[ ? ]</option>
                        <option value="me">me</option>
                        <option value="my">my</option>
                        <option value="I">I</option>
                    </select>!
                </div>
                <div class="sentence-line">Oh! There it is!</div>
                <div class="sentence-line">
                    That red hat is 
                    <select class="blank-select" data-ans="mine">
                        <option value="">[ ? ]</option>
                        <option value="mine">mine</option>
                        <option value="me">me</option>
                        <option value="my">my</option>
                    </select>!
                </div>
            `,
            readText: "I have a red hat. But I can't find my red hat. Please help me! Oh! There it is! That red hat is mine!"
        },
        {
            title: "Page 2: Ken & His Bike (He / his / him / his)",
            hint: "Check: He (主格) -> his (所有格) -> him (目的格) -> his (所有代名詞)",
            paragraphHtml: `
                <div class="sentence-line">Look at Ken!</div>
                <div class="sentence-line">
                    <select class="blank-select" data-ans="He">
                        <option value="">[ ? ]</option>
                        <option value="He">He</option>
                        <option value="His">His</option>
                        <option value="Him">Him</option>
                    </select> is my friend.
                </div>
                <div class="sentence-line">
                    I know 
                    <select class="blank-select" data-ans="him">
                        <option value="">[ ? ]</option>
                        <option value="his">his</option>
                        <option value="him">him</option>
                        <option value="he">he</option>
                    </select> well.
                </div>
                <div class="sentence-line">
                    <select class="blank-select" data-ans="His">
                        <option value="">[ ? ]</option>
                        <option value="He">He</option>
                        <option value="His">His</option>
                        <option value="Him">Him</option>
                    </select> new bike is cool.
                </div>
                <div class="sentence-line">
                    The big blue bike is 
                    <select class="blank-select" data-ans="his">
                        <option value="">[ ? ]</option>
                        <option value="him">him</option>
                        <option value="his">his</option>
                        <option value="he">he</option>
                    </select>!
                </div>
            `,
            readText: "Look at Ken! He is my friend. I know him well. His new bike is cool. The big blue bike is his!"
        },
        {
            title: "Page 3: Lisa & Her Cat (She / her / her / hers)",
            hint: "Check: She (主格) -> her (目的格) -> her (所有格) -> hers (所有代名詞)",
            paragraphHtml: `
                <div class="sentence-line">Look at Lisa!</div>
                <div class="sentence-line">
                    <select class="blank-select" data-ans="She">
                        <option value="">[ ? ]</option>
                        <option value="She">She</option>
                        <option value="Her">Her</option>
                        <option value="Hers">Hers</option>
                    </select> is my friend.
                </div>
                <div class="sentence-line">
                    I know 
                    <select class="blank-select" data-ans="her">
                        <option value="">[ ? ]</option>
                        <option value="she">she</option>
                        <option value="her">her</option>
                        <option value="hers">hers</option>
                    </select> well.
                </div>
                <div class="sentence-line">
                    <select class="blank-select" data-ans="Her">
                        <option value="">[ ? ]</option>
                        <option value="She">She</option>
                        <option value="Her">Her</option>
                        <option value="Hers">Hers</option>
                    </select> cat is very small.
                </div>
                <div class="sentence-line">
                    The cute white cat is 
                    <select class="blank-select" data-ans="hers">
                        <option value="">[ ? ]</option>
                        <option value="her">her</option>
                        <option value="hers">hers</option>
                        <option value="she">she</option>
                    </select>!
                </div>
            `,
            readText: "Look at Lisa! She is my friend. I know her well. Her cat is very small. The cute white cat is hers!"
        },
        {
            title: "Page 4: The Dog & Your Dog (It / its & your / yours)",
            hint: "Check: It (主格) -> its (所有格) / your (所有格) -> yours (所有代名詞)",
            paragraphHtml: `
                <div class="sentence-line">Look at that small dog!</div>
                <div class="sentence-line">
                    <select class="blank-select" data-ans="It">
                        <option value="">[ ? ]</option>
                        <option value="It">It</option>
                        <option value="Its">Its</option>
                        <option value="They">They</option>
                    </select> is under the tree.
                </div>
                <div class="sentence-line">
                    <select class="blank-select" data-ans="Its">
                        <option value="">[ ? ]</option>
                        <option value="It">It</option>
                        <option value="Its">Its</option>
                        <option value="It's">It's</option>
                    </select> tail is short and cute.
                </div>
                <div class="sentence-line">
                    Is it 
                    <select class="blank-select" data-ans="your">
                        <option value="">[ ? ]</option>
                        <option value="you">you</option>
                        <option value="your">your</option>
                        <option value="yours">yours</option>
                    </select> dog?
                </div>
                <div class="sentence-line">It is not my dog.</div>
                <div class="sentence-line">
                    So, I think it is 
                    <select class="blank-select" data-ans="yours">
                        <option value="">[ ? ]</option>
                        <option value="you">you</option>
                        <option value="your">your</option>
                        <option value="yours">yours</option>
                    </select>!
                </div>
            `,
            readText: "Look at that small dog! It is under the tree. Its tail is short and cute. Is it your dog? It is not my dog. So, I think it is yours!"
        },
        {
            title: "Page 5: Our House (We / our / us / ours)",
            hint: "Check: We (主格) -> our (所有格) -> us (目的格) -> ours (所有代名詞)",
            paragraphHtml: `
                <div class="sentence-line">My brother and I live here.</div>
                <div class="sentence-line">
                    <select class="blank-select" data-ans="We">
                        <option value="">[ ? ]</option>
                        <option value="We">We</option>
                        <option value="Our">Our</option>
                        <option value="Us">Us</option>
                    </select> have a big house.
                </div>
                <div class="sentence-line">
                    <select class="blank-select" data-ans="Our">
                        <option value="">[ ? ]</option>
                        <option value="We">We</option>
                        <option value="Our">Our</option>
                        <option value="Ours">Ours</option>
                    </select> house is white and nice.
                </div>
                <div class="sentence-line">
                    Many friends visit 
                    <select class="blank-select" data-ans="us">
                        <option value="">[ ? ]</option>
                        <option value="we">we</option>
                        <option value="our">our</option>
                        <option value="us">us</option>
                    </select> today.
                </div>
                <div class="sentence-line">
                    This beautiful garden is 
                    <select class="blank-select" data-ans="ours">
                        <option value="">[ ? ]</option>
                        <option value="our">our</option>
                        <option value="ours">ours</option>
                        <option value="us">us</option>
                    </select>!
                </div>
            `,
            readText: "My brother and I live here. We have a big house. Our house is white and nice. Many friends visit us today. This beautiful garden is ours!"
        },
        {
            title: "Page 6: Tom & Bob (They / their / them / theirs)",
            hint: "Check: They (主格) -> them (目的格) -> their (所有格) -> theirs (所有代名詞)",
            paragraphHtml: `
                <div class="sentence-line">Look at Tom and Bob!</div>
                <div class="sentence-line">
                    <select class="blank-select" data-ans="They">
                        <option value="">[ ? ]</option>
                        <option value="They">They</option>
                        <option value="Their">Their</option>
                        <option value="Them">Them</option>
                    </select> are playing outside.
                </div>
                <div class="sentence-line">
                    I know 
                    <select class="blank-select" data-ans="them">
                        <option value="">[ ? ]</option>
                        <option value="they">they</option>
                        <option value="their">their</option>
                        <option value="them">them</option>
                    </select> well.
                </div>
                <div class="sentence-line">
                    Look at 
                    <select class="blank-select" data-ans="their">
                        <option value="">[ ? ]</option>
                        <option value="their">their</option>
                        <option value="theirs">theirs</option>
                        <option value="them">them</option>
                    </select> soccer balls.
                </div>
                <div class="sentence-line">
                    Those new balls are 
                    <select class="blank-select" data-ans="theirs">
                        <option value="">[ ? ]</option>
                        <option value="their">their</option>
                        <option value="theirs">theirs</option>
                        <option value="them">them</option>
                    </select>!
                </div>
            `,
            readText: "Look at Tom and Bob! They are playing outside. I know them well. Look at their soccer balls. Those new balls are theirs!"
        }
    ];

    let currentPage = 0;

    function initQuiz() {
        const container = document.getElementById('quiz-container');
        pagesData.forEach((data, idx) => {
            const card = document.createElement('div');
            card.className = `card ${idx === 0 ? 'active' : ''}`;
            card.id = `card-${idx}`;

            card.innerHTML = `
                <div class="card-header">
                    <span class="card-title">${data.title}</span>
                    <button class="speak-btn" onclick="speakText('${data.readText.replace(/'/g, "\\'")}')">🔊 Read Story</button>
                </div>
                <div class="paragraph-box">${data.paragraphHtml}</div>
                <div class="hint-box" id="hint-${idx}">${data.hint}</div>
                <button class="check-btn" id="btn-${idx}" onclick="checkAnswers(${idx})">Check Answers ✨</button>
            `;
            container.appendChild(card);
        });
        updateProgress();
    }

    function checkAnswers(pageIdx) {
        const card = document.getElementById(`card-${pageIdx}`);
        const selects = card.querySelectorAll('select.blank-select');
        const hintBox = document.getElementById(`hint-${pageIdx}`);
        let allCorrect = true;

        selects.forEach(sel => {
            const userVal = sel.value;
            const correctVal = sel.getAttribute('data-ans');

            if (userVal === correctVal) {
                sel.classList.remove('wrong');
                sel.classList.add('correct');
            } else {
                sel.classList.add('wrong');
                allCorrect = false;
            }
        });

        if (allCorrect) {
            showExcellent();
            hintBox.style.display = 'none';
            const btn = document.getElementById(`btn-${pageIdx}`);
            btn.textContent = "Next Page ➔";
            btn.onclick = () => nextPage(pageIdx);
        } else {
            hintBox.style.display = 'block';
        }
    }

    function nextPage(pageIdx) {
        document.getElementById(`card-${pageIdx}`).classList.remove('active');
        currentPage++;

        if (currentPage < pagesData.length) {
            document.getElementById(`card-${currentPage}`).classList.add('active');
            updateProgress();
        } else {
            showResult();
        }
    }

    function updateProgress() {
        document.getElementById('pageNum').textContent = currentPage + 1;
        const percent = ((currentPage + 1) / pagesData.length) * 100;
        document.getElementById('progressFill').style.width = percent + '%';
    }

    function showResult() {
        document.getElementById('card-result').classList.add('active');
        document.getElementById('progressFill').style.width = '100%';
    }

    function showExcellent() {
        const popup = document.getElementById('excellentPopup');
        popup.classList.add('show');
        setTimeout(() => popup.classList.remove('show'), 1200);
    }

    function speakText(text) {
        if (!window.speechSynthesis) return;
        speechSynthesis.cancel();
        const ut = new SpeechSynthesisUtterance(text);
        ut.lang = 'en-US';
        ut.rate = 0.85;
        speechSynthesis.speak(ut);
    }

    initQuiz();
</script>
</body>
</html>
